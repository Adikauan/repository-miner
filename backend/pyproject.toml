[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repository-miner"
version = "0.1.0"
description = "GitLab repository author monitoring MVP"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "APScheduler>=3.10,<4",
  "cryptography>=42,<46",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["external_gitlab: opt-in tests requiring external GitLab credentials"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["repository_miner"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
